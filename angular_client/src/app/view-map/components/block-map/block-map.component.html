<ng-container #view>
  <div *ngIf="mobile==true" [ngClass]="open==true?'expandable-block-open':'expandable-block-close'">
  <div class="expandable-block-title-mob" (click)="onOpenClose()">
    <h3 class="h3-title">{{titleVO?.name}}</h3>
    <clr-icon shape="angle" [dir]="open==true?'up':'down'" size="24" class="ico-expandable"></clr-icon>
  </div>
  <div [ngClass]="open==true?'expandable-block-content-mob':'expandable-block-content-mob-hidden'">
    <div class="clr-row">
      <div class="clr-col">
        <div class="component-container-aspect-2-1" [id]="'cont-'+id" style="min-height: 450px">
          <div class="component">
           <!-- <iframe [src]="component_link | safe" width="100%" height="100%" [id]="'iframe-'+id"   [attr.type]="'none'"></iframe>-->
            <app-comp-map-viz
              [model]="model"
              [route]="route"
              [URL]="component_link"
              [visible] = "open"
            ></app-comp-map-viz>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
  <div class="expandable-block-desktop" *ngIf="mobile==false">
  <div class="expandable-block-title">
    <h3 class="h3-title">{{titleVO?.name}}</h3>
  </div>

  <div class="expandable-block-content-desktop">
    <div class="clr-row">
      <div class="clr-col">
        <div class="component-container-aspect-2-1" [id]="'cont-'+id" style="min-height: 450px">
          <div class="component">
            <!--<iframe [src]="component_link | safe" width="100%" height="100%" [id]="'iframe-'+id"   [attr.type]="'none'"></iframe>-->
            <app-comp-map-viz
              [model]="model"
              [route]="route"
              [URL]="component_link"
              [visible] = "true"
            ></app-comp-map-viz>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</ng-container>
