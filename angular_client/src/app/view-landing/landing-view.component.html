<div class="csb-app" id="csbApp" #view>
    <div class="csb-top-menu">
      <app-top-menu></app-top-menu>
    </div>
    <div class="csb-container" *ngIf="initialized==true">
      <main [ngClass]="mobile==true?'csb-content-mob':'csb-content-max'">

        <ng-container *ngIf="mobile==false">
          <div class="clr-row">
            <div class="clr-col-6">
              <div class="clr-row">
                <div class="clr-col">
                  <block-t1-t2></block-t1-t2>
                </div>
              </div>
              <div class="clr-row">
                <div class="clr-col">
                  <block-t1-info *ngIf="route?.T2=='all'"></block-t1-info>
                  <block-t1-t2-info *ngIf="route?.T2!=='all'"></block-t1-t2-info>
                </div>
              </div>
            </div>
            <div class="clr-col-6">
              <div class="clr-row">
                <div class="clr-col">
                  <block-m1-year></block-m1-year>
                </div>
              </div>
              <div class="clr-row">
                <div class="clr-col">
                  <block-m1-t1-links *ngIf="route?.T2=='all'"></block-m1-t1-links>
                  <block-m1-t1-t2-links *ngIf="route?.T2!=='all'"></block-m1-t1-t2-links>
                </div>
              </div>
            </div>
          </div>
        </ng-container>

        <!----------------------->
        <!-- expandable blocks -->
        <!----------------------->
        <ng-container *ngIf="mobile==true">
          <block-t1-t2></block-t1-t2>
          <block-m1-year></block-m1-year>

          <block-t1-info *ngIf="route?.T2=='all'"></block-t1-info>
          <block-t1-t2-info *ngIf="route?.T2!=='all'"></block-t1-t2-info>

          <block-m1-t1-links *ngIf="route?.T2=='all'"></block-m1-t1-links>
          <block-m1-t1-t2-links *ngIf="route?.T2!=='all'"></block-m1-t1-t2-links>
        </ng-container>


      </main>
    </div>
  <app-footer [containerID]="'csbApp'" [scrollTop]="false"></app-footer>
</div>
