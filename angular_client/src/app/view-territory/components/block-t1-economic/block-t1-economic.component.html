<ng-container #view>
  <div *ngIf="mobile==true" [ngClass]="open==true?'expandable-block-open':'expandable-block-close'">
    <div class="expandable-block-title-mob" (click)="onOpenClose()">
      <h3 class="h3-title">{{titleVO?.name}}</h3>
      <clr-icon shape="angle" [dir]="open==true?'up':'down'" size="24" class="ico-expandable"></clr-icon>
    </div>
    <div [ngClass]="open==true?'expandable-block-content-mob':'expandable-block-content-mob-hidden'">
      <!--
      <div class="content-text">
        <h4 class="h4-title">{{subTitleVO?.name}}</h4>
      </div>
      -->
      <!-- component goes here -->
      <div class="clr-row">
        <div class="clr-col">
          <div class="component-container" [id]="'cont-'+id">
            <div class="component">
              <app-comp-lines-chart
                [model]="model"
                [route]="route"
                [URL]="component_link"
                [visible]="open"
              ></app-comp-lines-chart>
            </div>
          </div>
        </div>
      </div>
      <!-- link -->
      <div class="clr-row">
        <div class="clr-col">
          <!-- view in map -->
          <!--<a routerLink="{{link}}" class="link"><span>{{linkVO?.name}}</span></a>-->
          <button class="btn btn-primary btn-map" routerLink="/{{link}}/">
            <span class="btn-map-label">{{linkVO?.name}}</span>
            <clr-icon shape="angle" dir="right"></clr-icon>
          </button><br>
        </div>
      </div>
    </div>
  </div>
  <div class="expandable-block-desktop" *ngIf="mobile==false">
    <div class="expandable-block-title">
      <h3 class="h3-title">{{titleVO?.name}}</h3>
    </div>

    <div class="expandable-block-content-desktop">
      <!--
      <div class="content-text">
        <h4 class="h4-title">{{subTitleVO?.name}}</h4>
      </div>
      -->
      <!-- component goes here -->
      <div class="clr-row">
        <div class="clr-col">
          <div class="component-container" [id]="'cont-'+id">
            <div class="component">
              <app-comp-lines-chart
                [model]="model"
                [route]="route"
                [URL]="component_link"
                [visible]="true"
              ></app-comp-lines-chart>
            </div>
          </div>
        </div>
      </div>
      <!-- link -->
      <div class="clr-row">
        <div class="clr-col">
          <!-- view in map -->
          <!--<a routerLink="{{link}}" class="link"><span>{{linkVO?.name}}</span></a>-->
          <button class="btn btn-primary btn-map" routerLink="/{{link}}/">
            <span class="btn-map-label">{{linkVO?.name}}</span>
            <clr-icon shape="angle" dir="right"></clr-icon>
          </button><br>
        </div>
      </div>
    </div>
  </div>
 </ng-container>
