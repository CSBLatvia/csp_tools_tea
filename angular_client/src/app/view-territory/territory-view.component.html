<div class="csb-app" id="csbApp" #view>
  <div class="csb-top-menu">
    <app-top-menu></app-top-menu>
  </div>
  <div class="csb-container" *ngIf="initialized==true">
    <main [ngClass]="mobile==true?'csb-content-mob':'csb-content-max'">

      <ng-container *ngIf="mobile==false">
          <div class="clr-row">
            <div class="clr-col-6">
                  <!-- stabiņš -->
                  <div class="clr-row">
                    <div class="clr-col">
                      <block-m1-m2></block-m1-m2>
                    </div>
                  </div>
                  <div class="clr-row">
                    <div class="clr-col">
                      <block-t1-info *ngIf="route?.T2=='all'"></block-t1-info>
                      <block-t1-t2-info *ngIf="route?.T2!=='all'"></block-t1-t2-info>
                    </div>
                  </div>
                  <div class="clr-row">
                <div class="clr-col">
                  <block-t1-t2-flow *ngIf="route?.T2!=='all'&&route?.M2=='e'"></block-t1-t2-flow>
                </div>
              </div>
                  <div class="clr-row">
                    <div class="clr-col">
                      <block-t1-industry></block-t1-industry>
                    </div>
                  </div>
                  <div class="clr-row">
                    <div class="clr-col">
                      <block-scatter-t1-links *ngIf="route?.T2=='all'"></block-scatter-t1-links>
                      <block-scatter-t1-t2-links *ngIf="route?.T2!=='all'"></block-scatter-t1-t2-links>
                    </div>
                  </div>
            </div>
            <div class="clr-col-6">
                <!-- stabiņš -->
                <div class="clr-row">
                  <div class="clr-col">
                    <block-t1-t2-year></block-t1-t2-year>
                  </div>
                </div>
                <div class="clr-row">
                  <div class="clr-col">
                    <block-t1-sector></block-t1-sector>
                  </div>
                </div>
                <div class="clr-row">
                  <div class="clr-col">
                    <block-t1-profession></block-t1-profession>
                  </div>
                </div>
                <div class="clr-row">
                  <div class="clr-col">
                    <block-t1-economic></block-t1-economic>
                  </div>
                </div>
            </div>
          </div>

      </ng-container>

      <ng-container *ngIf="mobile==true">
        <!----------------------->
        <!-- expandable blocks -->
        <!----------------------->
        <block-m1-m2></block-m1-m2><!-- done -->
        <block-t1-t2-year></block-t1-t2-year><!-- done -->

        <block-t1-info *ngIf="route?.T2=='all'"></block-t1-info><!-- done -->
        <block-t1-t2-info *ngIf="route?.T2!=='all'"></block-t1-t2-info><!-- done -->



        <!-- ext-percentage-list -->
        <block-t1-industry></block-t1-industry><!-- done -->
        <!-- ext-percentage-bar -->
        <block-t1-sector></block-t1-sector><!-- done -->
        <!-- ext-percentage-list-->
        <block-t1-profession></block-t1-profession><!-- done -->
        <!-- ext-lines-chart-->
        <block-t1-economic></block-t1-economic><!-- done -->
        <!-- ext-flow-chart -->
        <block-t1-t2-flow *ngIf="route?.T2!=='all'&&route?.M2=='e'"></block-t1-t2-flow><!-- done -->
        <!-- scatter bloks -->
        <block-scatter-t1-links *ngIf="route?.T2=='all'"></block-scatter-t1-links><!-- done -->
        <block-scatter-t1-t2-links *ngIf="route?.T2!=='all'"></block-scatter-t1-t2-links><!-- done -->
      </ng-container>

    </main>
  </div>
  <app-footer [containerID]="'csbApp'" [scrollTop]="false"></app-footer>
</div>
